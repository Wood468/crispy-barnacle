<style>
:root{color-scheme:dark;--bg:#0f1218;--card:#181d27;--line:#262d3b;--tx:#e8ecf3;--mu:#8d97aa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--vio:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}

.failing,.conflicting{color:var(--bad);border-color:#7f2d2d}.never,.datamined{color:var(--vio);border-color:#4b3d8a}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}.tag{background:#222a39;border-radius:8px;padding:1px 8px;font-size:12px;color:#c4cce0}
