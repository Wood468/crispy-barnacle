name: Production verification

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.toml"
      - "test/live_core_journey_qa.py"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for Cloudflare production build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-for-workers-build.mjs
      - name: Verify deployed shell and service worker match this commit
        run: |
          node --input-type=module <<'NODE'
          import { productionServesCommit } from './scripts/wait-for-workers-build.mjs';
          const deadline = Date.now() + 120000;
          let proof;
          do {
            proof = await productionServesCommit();
            if (proof.match) break;
            if (Date.now() >= deadline) throw new Error(proof.reason);
            await new Promise(resolve => setTimeout(resolve, 10000));
          } while (true);
          console.log('Verified:', proof.reason);
          NODE
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install Chromium for live mobile smoke test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify live mobile journeys at 360, 390 and 430px
        env:
          GOFN_ART_QA_URL: https://pogo.michaelpuff.com
          GOFN_CORE_QA_OUT: artifacts/live-core-mobile
        run: python test/live_core_journey_qa.py
      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification-evidence
          path: artifacts/live-core-mobile
          if-no-files-found: ignore
