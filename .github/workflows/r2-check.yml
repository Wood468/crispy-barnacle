name: R2 secret check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "token present" || { echo "::error title=Secret::CLOUDFLARE_API_TOKEN is empty"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "account id present" || { echo "::error title=Secret::CLOUDFLARE_ACCOUNT_ID is empty"; exit 1; }
          out=$(npx --yes wrangler@4 r2 bucket list 2>&1 | tr '\n' ' ' | cut -c1-400); echo "::notice title=Buckets::$out"
