name: R2 secret check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:   # secret names are spelled CLOUDFARE_* in GitHub (typo kept on purpose)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['id'])")
          export AWS_ACCESS_KEY_ID="$id" AWS_SECRET_ACCESS_KEY=$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1) AWS_DEFAULT_REGION=auto
          EP="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo ok > /tmp/ok.txt
          r=$(aws s3 cp /tmp/ok.txt s3://go-field-notes-images/_check/ok.txt --endpoint-url "$EP" 2>&1 | tr '\n' ' ' | cut -c1-300); echo "::notice title=S3Put::$r"
          l=$(aws s3 ls s3://go-field-notes-images/_check/ --endpoint-url "$EP" 2>&1 | tr '\n' ' ' | cut -c1-300); echo "::notice title=S3List::$l"
          d=$(aws s3 rm s3://go-field-notes-images/_check/ok.txt --endpoint-url "$EP" 2>&1 | tr '\n' ' ' | cut -c1-300); echo "::notice title=S3Rm::$d"
