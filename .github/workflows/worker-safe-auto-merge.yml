name: GO Aider bounded test-only auto-merge

# A separate trusted policy, not the coding worker, owns the merge permission.
# All other PRs fail closed; only explicitly source-issue-approved flat test
# edits, with the full latest-head Tests workflow passing, can be considered.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Dispatch the full post-merge main Tests workflow even though the
  # GITHUB_TOKEN-produced merge does not emit a normal push-triggered run.
  actions: write
  # Close only the owner-approved issue already revalidated by trusted policy.
  issues: write

concurrency:
  group: worker-safe-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  independently_guarded_merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'worker/review-') &&
      github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Never checkout, install packages from, or execute code from PR head.
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Use Node 22 from approved action
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Independently revalidate policy and merge eligible test-only draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_EVENT: ${{ toJSON(github.event.workflow_run) }}
        run: node scripts/worker-safe-auto-merge.mjs
