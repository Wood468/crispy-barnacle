name: Sprint 4 Source Readiness (Audit Only)

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail this audit run when canonical source links remain unresolved'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sprint4-source-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Display exact source-link coverage (never publish)
        env:
          STRICT: ${{ inputs.strict }}
        shell: bash
        run: |
          if [[ "$STRICT" == "true" ]]; then
            node scripts/importer/source-facet-readiness-cli.mjs --json --strict
          else
            node scripts/importer/source-facet-readiness-cli.mjs --json
          fi
