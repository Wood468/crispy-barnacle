name: Event details importer

on:
  schedule:
    # Hourly at :52 UTC. Shifted from :20 after repeated missing scheduled runs; GitHub may still delay starts.
    - cron: "52 * * * *"
  workflow_dispatch:
  # Importer and contract changes must immediately regenerate their output
  # after an approved main-branch merge. Generated data files are intentionally
  # NOT in this list, so an importer commit cannot trigger itself recursively.
  push:
    branches: [main]
    paths:
      - "scripts/importer/**"
      - "scripts/event-experience/**"
      - "public/event-adapter.js"
      - "public/event-contract.js"
      - "data/watch-pages.json"
      - ".github/workflows/event-importer.yml"

permissions:
  contents: write

concurrency:
  group: event-importer
  cancel-in-progress: false

env:   # the secret names are spelled CLOUDFARE_* in GitHub (typo kept on purpose); scripts/r2-sync.sh reads these
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Restore pictures from R2
        run: bash scripts/r2-sync.sh restore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the importer code
        run: node --test test/importer.test.mjs test/importer-world.test.mjs test/dedupe.test.mjs
      - name: Read the sources and compare them
        run: node scripts/importer/run.mjs
      - name: Join events listed twice and write the duplicate report
        run: node scripts/dup-audit.mjs --apply
      - name: Verify generated event data and downstream event contracts
        # Run after importing and deduplicating, before any generated files are committed.
        # Catch correct-looking raw source data that loses research rewards or Pokémon forms
        # on the universal Event Details and Battle path.
        run: |
          node --test test/importer.test.mjs test/importer-world.test.mjs test/dedupe.test.mjs
          node --test test/research-event-propagation.test.mjs test/into-wild-form-identity.test.mjs test/importer-final-form-invariant.test.mjs
      - name: Tell me on Telegram about newly found events
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_EVENTS: ${{ secrets.TELEGRAM_TOPIC_EVENTS || secrets.TELEGRAM_TOPICS_EVENTS }}
          TELEGRAM_TOPIC_PICTURES: ${{ secrets.TELEGRAM_TOPIC_PICTURES || secrets.TELEGRAM_TOPICS_PICTURES }}
          TELEGRAM_TOPIC_CHANGES: ${{ secrets.TELEGRAM_TOPIC_CHANGES || secrets.TELEGRAM_TOPICS_CHANGES }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
        run: node scripts/event-news.mjs
      - name: Find moves that events hand out for a limited time
        run: node scripts/event-moves.mjs
      - name: Find pictures for costume Pokémon
        run: node scripts/costumes.mjs
      - name: Check our dates against Leek Duck's events list
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_EVENTS: ${{ secrets.TELEGRAM_TOPIC_EVENTS || secrets.TELEGRAM_TOPICS_EVENTS }}
          TELEGRAM_TOPIC_PICTURES: ${{ secrets.TELEGRAM_TOPIC_PICTURES || secrets.TELEGRAM_TOPICS_PICTURES }}
          TELEGRAM_TOPIC_CHANGES: ${{ secrets.TELEGRAM_TOPIC_CHANGES || secrets.TELEGRAM_TOPICS_CHANGES }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
        run: node scripts/schedule-audit.mjs
      - name: Keep our own copy of pictures taken from other sites
        run: |
          node scripts/mirror-images.mjs
          bash scripts/r2-sync.sh save
      - name: Reconcile the catalogue after source and artwork updates
        run: |
          node scripts/event-experience/build-catalogue.cjs
          node scripts/event-experience/audit-catalogue-v1.cjs
      - name: Commit when something changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/events-v1.json data/seen-events.json public/event-details.json public/world-events.json data/importer-report.json data/importer-lines.json public/costumes.json data/schedule-audit.json data/audit-alerted.json data/dup-audit.json data/event-aliases.json public/season.json public/account.js public/dash.js public/event-info.json public/data.json public/event-moves.json public/event-artwork.json
          node scripts/validate-public-data.mjs
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          # The "updated" stamp alone is not worth a deploy: only commit when the facts changed.
          if [ -n "$(git diff --cached --name-only -- public/img public/costumes.json public/season.json public/account.js public/dash.js public/event-info.json public/data.json public/event-moves.json)" ] || git diff --cached -U0 -- public/event-details.json public/world-events.json | grep -E '^[+-] ' | grep -vqE '"updated"'; then
            git commit -m "Event details: refresh from sources"
          else
            git commit -m "Event details: refresh stamp [skip ci]"
          fi
          git pull -q --rebase --autostash origin main
          node scripts/validate-public-data.mjs
          git push origin HEAD:main

      - name: Retain rejected source regeneration for diagnosis
        # When a gate rejects regenerated content, keep the candidate snapshots
        # for review rather than publishing or guessing at a correction.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejected-event-import-${{ github.run_id }}
          path: |
            public/event-details.json
            public/world-events.json
            data/importer-report.json
            data/dup-audit.json
          if-no-files-found: ignore
          retention-days: 3
