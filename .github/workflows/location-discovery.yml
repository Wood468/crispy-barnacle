name: Community event location discovery

on:
  schedule:
    # Six-hourly UTC schedule; GitHub may delay scheduled starts.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-location-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check discovery script syntax
        run: node --check scripts/location-discovery.mjs
      - name: Discover community-reported coordinates
        run: node scripts/location-discovery.mjs
      - name: Commit newly sourced community locations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/places.json
          node scripts/validate-public-data.mjs
          if git diff --cached --quiet; then echo "No new coordinate reports."; exit 0; fi
          git commit -m "Places: add community-reported event coordinates"
          git pull --rebase origin main
          git push origin HEAD:main
