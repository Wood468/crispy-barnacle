name: PWA offline comparison (diagnostic branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target:
          - e8f616aae8fdf2bcff2e323cc78408b6a4a8e38e
        trial: [1, 2]
    env:
      GO_FIELD_NOTES_TEST_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.65.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-1.65.1
      - run: python -m playwright install --with-deps webkit
      - name: Run original PWA test with read-only diagnostics
        shell: bash
        run: |
          python -m http.server 8791 --directory public > /tmp/pwa-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8791/ > /dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          from pathlib import Path
          target = Path('test/pwa_upgrade_browser.py')
          source = target.read_text()
          snapshot = '''
              print('PWA boundary:', page.evaluate("""async () => ({
                  markerType: typeof window.__oldController,
                  controllerState: navigator.serviceWorker.controller?.state,
                  controlledByActive: navigator.serviceWorker.controller === (await navigator.serviceWorker.getRegistration()).active,
                  caches: await Promise.all((await caches.keys()).filter(n => n.startsWith('gofn-shell-')).map(async name => {
                      const cache = await caches.open(name);
                      return {name, data: !!(await cache.match('/data.json')), index: !!(await cache.match('/index.html')), keys: (await cache.keys()).length};
                  }))
              })"""), flush=True)
          '''
          source = source.replace('    context.set_offline(True)', snapshot + '\n    context.set_offline(True)')
          # Execute the original script in place so its source-root calculation is unchanged.
          exec(compile(source, str(target.resolve()), 'exec'), {'__file__': str(target.resolve()), '__name__': '__main__'})
          PY
