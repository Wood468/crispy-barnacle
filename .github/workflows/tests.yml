name: PWA offline comparison (diagnostic branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        target:
          - 3625a03502c67e08bee7f74db835ac3bf0cb6e02
        trial: [1, 2]
    env:
      GO_FIELD_NOTES_TEST_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.65.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-1.65.1
      - run: python -m playwright install --with-deps webkit
      - name: Run original PWA test with read-only diagnostics
        shell: bash
        run: |
          python -m http.server 8791 --directory public > /tmp/pwa-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8791/ > /dev/null; then break; fi
            sleep 1
          done
          python - <<'PY'
          from pathlib import Path
          target = Path('test/pwa_upgrade_browser.py')
          source = target.read_text()
          import ast
          from playwright.sync_api import sync_playwright, TimeoutError as BrowserTimeout
          tree = ast.parse(source)
          expressions = [n.args[1].value for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == 'wait_for_async' and len(n.args) > 1 and isinstance(n.args[1], ast.Constant)]
          gate = next(x for x in expressions if 'const required' in x)
          helper = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'wait_for_async')
          import time
          namespace = {'time': time}
          exec(compile(ast.Module(body=[helper], type_ignores=[]), '<actual async helper>', 'exec'), namespace)
          wait = namespace['wait_for_async']
          with sync_playwright() as pw:
              browser = pw.webkit.launch()
              page = browser.new_page()
              page.goto('http://127.0.0.1:8791/offline.html')
              result = page.wait_for_function('async () => false', timeout=300)
              assert result.json_value() is False
              print('NEGATIVE CONTROL: old wait_for_function returned false without waiting', flush=True)
              for predicate in ['async () => false', gate]:
                  try:
                      wait(page, predicate, arg='pwa-readiness-probe', timeout=300)
                  except AssertionError as error:
                      assert 'Timed out' in str(error)
                      print('PASS actual helper blocks false/empty async readiness', flush=True)
                  else:
                      raise AssertionError('False async readiness unexpectedly accepted')
              page.evaluate("""async () => {
                  const c = await caches.open('pwa-readiness-probe');
                  for (const path of ['/index.html','/app.js','/dash.js','/detail.js']) await c.put(path, new Response('fixture'));
              }""")
              try:
                  wait(page, gate, arg='pwa-readiness-probe', timeout=300)
              except AssertionError as error:
                  assert 'Timed out' in str(error)
                  print('PASS actual helper blocks missing data.json readiness', flush=True)
              else:
                  raise AssertionError('Missing data readiness unexpectedly accepted')
              page.evaluate("caches.open('pwa-readiness-probe').then(c => c.put('/data.json', new Response('{}')))")
              wait(page, gate, arg='pwa-readiness-probe', timeout=300)
              print('PASS actual helper accepts complete readiness', flush=True)
              page.evaluate("caches.delete('pwa-readiness-probe')")
              browser.close()
          snapshot = '''
              print('PWA boundary:', page.evaluate("""async () => ({
                  markerType: typeof window.__oldController,
                  controllerState: navigator.serviceWorker.controller?.state,
                  registration: {installing: (await navigator.serviceWorker.getRegistration()).installing?.state, waiting: (await navigator.serviceWorker.getRegistration()).waiting?.state},
                  controlledByActive: navigator.serviceWorker.controller === (await navigator.serviceWorker.getRegistration()).active,
                  caches: await Promise.all((await caches.keys()).filter(n => n.startsWith('gofn-shell-')).map(async name => {
                      const cache = await caches.open(name);
                      return {name, data: !!(await cache.match('/data.json')), dataIgnoringSearch: !!(await cache.match('/data.json', {ignoreSearch:true})), dataKeys: (await cache.keys()).filter(r => new URL(r.url).pathname === '/data.json').map(r => r.url), index: !!(await cache.match('/index.html')), keys: (await cache.keys()).length};
                  }))
              })"""), flush=True)
          '''
          source = source.replace('    context.set_offline(True)', snapshot + '\n    context.set_offline(True)')
          # Execute the original script in place so its source-root calculation is unchanged.
          exec(compile(source, str(target.resolve()), 'exec'), {'__file__': str(target.resolve()), '__name__': '__main__'})
          PY
