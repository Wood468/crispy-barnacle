name: Live exact-form artwork QA

# Inspect deployed public images without publishing assets or writing player state.
# Pull requests provide a read-only baseline; push checks wait for any new build.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "test/live_form_art_qa.py"
      - "test/live_event_specials_qa.py"
      - ".github/workflows/live-form-art-qa.yml"
  push:
    branches: [main]
    paths:
      - "public/event-adapter.js"
      - "public/event-details.json"
      - "public/artwork-manifest.json"
      - "src/worker.js"
      - "test/live_form_art_qa.py"
      - ".github/workflows/live-form-art-qa.yml"

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: live-form-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-exact-form-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wait for matching production release when deployed paths changed
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(public/|src/|workers/|migrations/|wrangler[.]toml$)'; then
            node scripts/wait-for-workers-build.mjs
          else
            echo "No new deployed app assets; checking current production."
          fi
      - name: Verify exact live form art and capture Event Details at 360/390/430px
        env:
          GOFN_ART_QA_URL: https://pogo.michaelpuff.com
          GOFN_ART_QA_OUT: artifacts/live-form-art
        run: python test/live_form_art_qa.py
      - name: Verify live Coin Bag form, 10 km eggs and Saturday/Sunday raid cards
        env:
          GOFN_ART_QA_URL: https://pogo.michaelpuff.com
          GOFN_EVENT_QA_OUT: artifacts/live-event-specials
        run: python test/live_event_specials_qa.py
      - name: Preserve JSON diagnostics and phone screenshots, even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-form-art-${{ github.run_id }}
          path: |
            artifacts/live-form-art
            artifacts/live-event-specials
          if-no-files-found: warn
          retention-days: 30
