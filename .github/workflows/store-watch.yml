name: Web store watch

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent and do not save the state"
        default: "true"

permissions:
  contents: write

concurrency:
  group: store-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install a browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test regional price safeguards
        run: node --test test/store-au-prices.test.mjs test/regional-prices.test.cjs test/regional-observations.test.mjs
      - name: Audit known publisher-only listings and missing regional prices
        run: |
          node --test test/store-catalogue-audit.test.mjs
          node scripts/store-catalogue-audit.mjs
      - name: Read the store
        run: python scripts/store_snapshot.py /tmp/store-snapshot.json
      - name: Refresh verified Australian catalogue when snapshot explicitly uses A$
        run: node scripts/store-au-prices.mjs /tmp/store-snapshot.json
      - name: Regional price review (no screenshots, never fails the watch)
        run: node scripts/regional-price-review.mjs || true
      - name: Tell me about anything new
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_EVENTS: ${{ secrets.TELEGRAM_TOPIC_EVENTS || secrets.TELEGRAM_TOPICS_EVENTS }}
          TELEGRAM_TOPIC_PICTURES: ${{ secrets.TELEGRAM_TOPIC_PICTURES || secrets.TELEGRAM_TOPICS_PICTURES }}
          TELEGRAM_TOPIC_CHANGES: ${{ secrets.TELEGRAM_TOPIC_CHANGES || secrets.TELEGRAM_TOPICS_CHANGES }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/store-watch.mjs /tmp/store-snapshot.json
      # Read only: inspect ALL newly fetched purchase SKUs, including standalone
      # items that are intentionally absent from the filtered public Store log.
      # Never approve, publish or substitute publisher image candidates.
      - name: Audit Store product artwork candidates (report only)
        continue-on-error: true
        run: |
          node --test test/store-artwork-coverage.test.mjs
          node scripts/store-artwork-coverage.mjs /tmp/store-snapshot.json
      - name: Publish sanitized current Store SKU membership
        run: node scripts/store-current-snapshot.mjs data/store-state.json public/store-current.json
      # A manual dry-run must never publish the AU price importer’s local changes.
      # Scheduled watches and explicitly live manual runs continue to save state.
      - name: Remember what was seen
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/store-state.json public/store-log.json public/store-current.json public/prices.json 2>/dev/null || true
          node scripts/validate-public-data.mjs
          if git diff --cached --quiet; then exit 0; fi
          # The live planner reads public/store-log.json from the deployed site, so a real change (an item appeared, left or changed
          # price) must be deployed. A new "checked" time on its own is not worth a deploy, so that commit stays [skip ci].
          msg="Store watch: remember what was seen [skip ci]"
          if git diff --cached -U0 -- public/store-log.json public/prices.json | grep -E '^[+-] ' | grep -v -E '"(updated|lastSeen)"' | grep -q .; then
            msg="Store watch: the store changed"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git pull -q --rebase origin main
          node scripts/validate-public-data.mjs
          git push origin HEAD:main
