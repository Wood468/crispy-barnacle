name: Web store watch

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent and do not save the state"
        default: "true"
      rebaseline:
        description: "Treat the next snapshot as the new baseline (nothing is announced). Use once after switching to the Melbourne reader"
        default: "false"

permissions:
  contents: write

concurrency:
  group: store-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test regional price safeguards
        run: node --test test/store-au-prices.test.mjs test/regional-prices.test.cjs test/regional-observations.test.mjs
      - name: Audit known publisher-only listings and missing regional prices
        run: |
          node --test test/store-catalogue-audit.test.mjs
          node scripts/store-catalogue-audit.mjs
      # The Melbourne Home Assistant add-on uploads the A$ snapshot to the Worker (this runner's US address sees the US store).
      # No usable upload (missing, or older than 6 hours) skips this run's store processing; the stale alert below reports it.
      - name: Read the store
        id: read
        run: |
          if curl --fail-with-body -sS https://pogo.michaelpuff.com/api/store-ingest -o /tmp/store-snapshot.json && node scripts/store-watch.mjs --check-fresh /tmp/store-snapshot.json; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No fresh Melbourne store snapshot; skipping store processing this run"
          fi
      - name: Refresh verified Australian catalogue when snapshot explicitly uses A$
        if: ${{ steps.read.outputs.fresh == 'true' }}
        run: node scripts/store-au-prices.mjs /tmp/store-snapshot.json
      - name: Regional price review (no screenshots, never fails the watch)
        if: ${{ steps.read.outputs.fresh == 'true' }}
        run: node scripts/regional-price-review.mjs || true
      - name: Tell me about anything new
        if: ${{ steps.read.outputs.fresh == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_EVENTS: ${{ secrets.TELEGRAM_TOPIC_EVENTS || secrets.TELEGRAM_TOPICS_EVENTS }}
          TELEGRAM_TOPIC_PICTURES: ${{ secrets.TELEGRAM_TOPIC_PICTURES || secrets.TELEGRAM_TOPICS_PICTURES }}
          TELEGRAM_TOPIC_CHANGES: ${{ secrets.TELEGRAM_TOPIC_CHANGES || secrets.TELEGRAM_TOPICS_CHANGES }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          STORE_REBASELINE: ${{ github.event.inputs.rebaseline == 'true' && '1' || '' }}
        run: node scripts/store-watch.mjs /tmp/store-snapshot.json
      # One Telegram message (system topic) if the published snapshot is over 3 days old or the reader has not uploaded for 6 hours;
      # at most once per 24 hours (state.staleAlertAt, committed by the save step below).
      - name: Warn if the snapshot has gone stale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/store-watch.mjs --stale-alert
      # Read only: inspect ALL newly fetched purchase SKUs, including standalone
      # items that are intentionally absent from the filtered public Store log.
      # Never approve, publish or substitute publisher image candidates.
      - name: Audit Store product artwork candidates (report only)
        continue-on-error: true
        if: ${{ steps.read.outputs.fresh == 'true' }}
        run: |
          node --test test/store-artwork-coverage.test.mjs
          node scripts/store-artwork-coverage.mjs /tmp/store-snapshot.json
      # A manual dry-run must never publish the AU price importer’s local changes.
      # Scheduled watches and explicitly live manual runs continue to save state.
      - name: Remember what was seen
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          # Private publication heartbeat: stamped into the commit that is about to be pushed, so it only persists if the
          # push to main succeeds (a failed push fails the job and the stamp is discarded with the runner). It records
          # publication to main, not Cloudflare deployment. Held/invalid/incomplete runs are not stamped.
          node scripts/store-watch.mjs --stamp-publication
          git add -- data/store-state.json public/store-log.json public/store-current-snapshot.json public/prices.json 2>/dev/null || true
          node scripts/validate-public-data.mjs
          if git diff --cached --quiet; then exit 0; fi
          # The live planner reads public/store-log.json from the deployed site, so a real change (an item appeared, left or changed
          # price) must be deployed. A new "checked" time on its own is not worth a deploy, so that commit stays [skip ci].
          msg="Store watch: remember what was seen [skip ci]"
          if git diff --cached -U0 -- public/store-log.json public/store-current-snapshot.json public/prices.json | grep -E '^[+-] ' | grep -v -E '"(updated|lastSeen)"' | grep -q .; then
            msg="Store watch: the store changed"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$msg"
          git pull -q --rebase origin main
          node scripts/validate-public-data.mjs
          git push origin HEAD:main
