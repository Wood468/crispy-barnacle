name: Site check

# Every 15 minutes: is the live site up, are the data files readable, do R2 pictures load? Telegram (System topic) is told
# only when it starts failing and when it recovers. Roadmap-only commits do not publish Worker assets.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "workers/**"
      - "scripts/uptime.mjs"
      - "scripts/wait-for-workers-build.mjs"
      - ".github/workflows/uptime.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  with:
    fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for the Cloudflare Workers production build when app files changed
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(public/|src/|workers/|migrations/|wrangler\\.toml$)'; then
            node scripts/wait-for-workers-build.mjs
          else
            echo "No deployed app paths changed; checking the current production site."
          fi
      - name: Check the live site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_SYSTEM: ${{ secrets.TELEGRAM_TOPIC_SYSTEM || secrets.TELEGRAM_TOPICS_SYSTEM }}
        run: node scripts/uptime.mjs
