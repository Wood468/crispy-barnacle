name: Public data validation

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.json"
      - "public/*.json"
      - "data/**/*.json"
      - "infographics.json"
      - "scripts/validate-public-data.mjs"
      - ".github/workflows/data-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**/*.json"
      - "public/*.json"
      - "data/**/*.json"
      - "infographics.json"
      - "scripts/validate-public-data.mjs"
      - ".github/workflows/data-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON, event records and published infographic paths
        run: node scripts/validate-public-data.mjs
