name: Resend text-only infographics as pictures

# One-off. Dry run by default: it only lists what it would send.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only list, false = send"
        default: "true"
      since:
        description: "Posted on or after this date"
        default: "2026-10-21"

permissions:
  contents: read

env:   # the secret names are spelled CLOUDFARE_* in GitHub (typo kept on purpose); scripts/r2-sync.sh reads these
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFARE_ACCOUNT_ID }}

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Restore pictures from R2
        env:
          R2_ONLY: infographics
        run: bash scripts/r2-sync.sh restore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_PICTURES: ${{ secrets.TELEGRAM_TOPIC_PICTURES || secrets.TELEGRAM_TOPICS_PICTURES }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SINCE: ${{ github.event.inputs.since }}
        run: node scripts/resend-pictures.mjs
