name: Today slow-feed production smoke

on:
  push:
    branches: [main]
    paths:
      - "public/*.js"
      - "public/*.css"
      - "public/*.html"
      - "src/**"
      - "test/slow_feed_browser.py"
      - ".github/workflows/slow-feed-production.yml"
  schedule:
    # 8:30 am Melbourne during AEDT; read-only browser fault injection.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: today-slow-feed-production-smoke
  cancel-in-progress: false

jobs:
  production-slow-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for the exact production Workers build when app files changed
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(public/.*\\.(js|css|html)|src/.*)$'; then
            node scripts/wait-for-workers-build.mjs
          else
            echo "No deployed app paths changed; testing the current production version."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Cache Playwright browser
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2
      - name: Install Playwright
        run: |
          pip install playwright
          if [ "${{ steps.pw.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
            python -m playwright install chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify production Today fallback and late recovery
        env:
          GO_FIELD_NOTES_SLOW_FEED_URL: https://pogo.michaelpuff.com
        run: python test/slow_feed_browser.py
