name: probe sources (temporary)
on:
  pull_request:
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe candidate official sites from a GitHub runner
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          const UA = { "user-agent": "Mozilla/5.0 (compatible; go-field-notes probe)", "accept-language": "en" };
          const pages = [
            "https://www.pokemon.com/us/pokemon-video-games/pokemon-go",
            "https://www.pokemon.com/us/pokemon-news",
            "https://www.pokemon.com/uk/pokemon-news",
            "https://www.pokemon.co.jp/ex/pokemongo/",
            "https://www.pokemon.co.jp/info/",
            "https://www.pokemon.co.kr/",
            "https://tw.portal-pokemon.com/",
            "https://www.pokemon.com/es/",
            "https://pokemongolive.com/",
            "https://pokemongo.com/en/news",
            "https://pokemongo.com/es_MX/news",
            "https://www.reddit.com/r/pokemongo/new.rss",
            "https://www.youtube.com/@pokemongo",
            "https://www.youtube.com/@PokemonGOJapan",
            "https://www.youtube.com/@pokemongo_jp",
            "https://www.youtube.com/@PokemonGOLATAM",
            "https://nitter.net/PokemonGoApp/rss",
          ];
          for (const u of pages) {
            try {
              const r = await fetch(u, { headers: UA, redirect: "follow", signal: AbortSignal.timeout(20000) });
              const t = await r.text();
              const rss = [...t.matchAll(/<link[^>]+type="application\/(?:rss|atom)\+xml"[^>]*>/gi)].map(m => (m[0].match(/href="([^"]+)"/) || [])[1]).filter(Boolean).slice(0, 3);
              const ch = (t.match(/"channelId":"(UC[\w-]{20,})"/) || t.match(/channel_id=(UC[\w-]{20,})/) || [])[1] || "";
              const title = ((t.match(/<title[^>]*>([^<]*)/i) || [])[1] || "").replace(/\s+/g, " ").trim().slice(0, 70);
              console.log(`::notice::PROBE ${r.status} ${u} -> ${r.url !== u ? r.url + " " : ""}[${title}] rss=${rss.join(",")} yt=${ch} bytes=${t.length}`);
            } catch (e) { console.log(`::notice::PROBE FAIL ${u} ${String(e.message).slice(0, 80)}`); }
          }
          JS
          node probe.mjs
