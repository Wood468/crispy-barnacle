name: CodeQL

on:
  push:
    branches: [main]
    paths: ["src/**", "public/*.js", "scripts/**"]
  pull_request:
    branches: [main]
    paths: ["src/**", "public/*.js", "scripts/**"]
  schedule:
    - cron: "30 21 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
