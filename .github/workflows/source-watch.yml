name: Source watch

# Reads the shiny / costume feeds in data/source-feeds.json and re-scores the next 30 days of events.
# Also lists new Pokémon GO posts on other official Pokémon sites (scripts/site-watch.mjs, Telegram Changes topic).
# Writes data/source-watch.json, data/shiny-scorecard.json and data/site-watch.json only; it never edits public data.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read feeds and score claims
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPIC_CHANGES: ${{ secrets.TELEGRAM_TOPIC_CHANGES || secrets.TELEGRAM_TOPICS_CHANGES }}
        run: |
          set -euo pipefail
          node scripts/source-watch.mjs
          node scripts/shiny-scorecard.mjs
          node scripts/scrapedduck-compare.mjs
          node scripts/site-watch.mjs
          git add -- data/source-watch.json data/shiny-scorecard.json data/scrapedduck-compare.json data/site-watch.json
          # the timestamps alone are not worth a commit
          # (no `grep -q` here: with pipefail it ends the pipe early and the test wrongly fails)
          changed=$(git diff --cached -U0 | grep -E '^[+-] ' | grep -vE '"updated"' | wc -l || true)
          if [ "${changed:-0}" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Source watch: shiny and costume feeds [skip ci]"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
