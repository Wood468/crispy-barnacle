name: Source watch

# Reads the shiny / costume feeds in data/source-feeds.json and re-scores the next 30 days of events.
# Writes data/source-watch.json and data/shiny-scorecard.json only; it never edits public data.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read feeds and score claims
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-watch.mjs
          node scripts/shiny-scorecard.mjs
          node scripts/scrapedduck-compare.mjs
          git add -- data/source-watch.json data/shiny-scorecard.json data/scrapedduck-compare.json
          # the timestamps alone are not worth a commit
          # (no `grep -q` here: with pipefail it ends the pipe early and the test wrongly fails)
          changed=$(git diff --cached -U0 | grep -E '^[+-] ' | grep -vE '"updated"' | wc -l || true)
          if [ "${changed:-0}" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Source watch: shiny and costume feeds [skip ci]"
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
